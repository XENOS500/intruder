services:
  - type: web
    name: intruder-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ENABLE_SELF_PING
        value: "true"
      - key: SELF_PING_INTERVAL_MINUTES
        value: "14"
